{% extends "_base.html" %}

{% load crispy_forms_tags %}


{% block page_title %}
بازیابی رمز عبور
{% endblock %}



{% block page_content %}


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">


                <h3 class="text-center mb-4">
                    بازیابی رمز عبور
                </h3>


                <form method="post">

                    {% csrf_token %}


                    {{ form|crispy }}


                    <button type="submit"
                            class="btn btn-primary btn-block">

                        ارسال لینک

                    </button>


                </form>


            </div>

        </div>

    </div>

</div>


{% endblock %}
