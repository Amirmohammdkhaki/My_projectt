{% extends '_base.html' %}


{% block page_title %}
    {{ product.title }}
{% endblock %}


{% block page_content %}

<h1>{{ product.title }}</h1>

<p>{{ product.description }}</p>

<p>Price: {{ product.price }}</p>



{% if product.cover %}
    <img src="{{ product.cover.url }}" width="300">
{% endif %}

{% endblock %}
